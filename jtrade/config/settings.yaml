# jtrade settings — single source of truth for ports, risk params, and universe classification.
# All values here are read/validated by jtrade/config.py. No secrets belong in this file.

ibkr:
  host: "127.0.0.1"        # IB Gateway host. On WSL2-with-Gateway-on-Windows, set to the host IP.
  port: 4001               # 4001 = live, 4002 = paper. Flip this single line to test on paper.
  client_id_cli: 11        # fixed clientId for CLI front-end (avoids collisions)
  client_id_mcp: 12        # fixed clientId for MCP front-end
  account: ""              # optional explicit account id; blank = first managed account
  market_data_type: 1      # 1=live, 2=frozen, 3=delayed, 4=delayed-frozen (probe may recommend 3)
  connect_timeout: 15      # seconds

data:
  source_order: ["ibkr", "yfinance"]   # try IBKR first, fall back to yfinance if enabled/available
  yfinance_fallback: true
  history_years: 5                     # daily bars lookback for stage analysis
  cache_dir: "state/bars_cache"        # parquet cache; same-day bars reused
  hist_pacing_sleep: 1.0               # seconds between historical requests (IBKR ~50 req / 10 min)

universe:
  workbook: "tktList/etfsToMonitor.xlsx"
  ticker_column: 1                     # 1-indexed; column A holds the ticker on every sheet
  header_row: 1
  # Sheets whose symbols are screened for monitoring but NEVER produce order proposals.
  monitor_only_sheets: ["indexes", "currencies"]
  # Individual symbols that are non-tradable via plain US Stock/ETF (indices, spot crypto,
  # forex), plus tickers IBKR SMART can't resolve as a US listing (delisted/renamed/wrong
  # ticker) — surfaced by the 2026-07-13 scan as "No security definition".
  monitor_only_symbols: ["VIX", "LTC", "ETH", "BTC", "XRP", "DOGE", "IWW", "SPVU", "SPMV", "FM"]

criteria:
  enabled: ["stage_analysis"]
  stage_analysis:
    ma_short: 50
    ma_long: 200
    rsi_period: 14
    benchmark: "SPY"                   # relative-strength benchmark for `strength`

risk:
  equity_risk_per_trade: 0.01          # 1% of NetLiquidation risked per trade
  max_aggregate_risk: 0.15             # open + proposed risk must stay <= 15% equity
  max_new_proposals: 10                # per scan, ranked by signal strength
  min_cash_reserve: 4000               # keep >= US$4,000 cash after proposed trades
  stop:
    method: "ma_below"                 # protective stop: below the long MA (30wk/150d proxy)
    ma_period: 150                     # 30-week / 150-day MA used for the stop
    ma_buffer_pct: 0.02                # place stop 2% below the MA
    max_stop_distance_pct: 0.25        # if MA stop is further than this from entry, use ATR
    atr_period: 14
    atr_mult: 2.0                      # ATR fallback when MA stop is invalid/too wide
  limit_offset_pct: 0.001              # limit price offset from reference (0.1%)
  default_order_type: "LMT"            # LMT preferred; MKT available as per-order override

execute:
  dry_run: true                        # DEFAULT ON during bring-up: build+log orders, never transmit
  audit_log: "state/audit.log"
  pending_orders: "state/pending_orders.yaml"

report:
  out_dir: "reports"
  columns: ["TKT", "Price", "Change", "Stage", "Signal"]
