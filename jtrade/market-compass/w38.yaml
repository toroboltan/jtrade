validation:
  as_of: "2026-09-13"
  concluded_scenario: "Bear-leaning Base — the setup favors a pullback, but Monday's open and Wednesday's Fed decision are the real tests"
  concluded_note: >-
    This week's newsletter is explicitly a probabilities-not-outcomes call:
    "the pullback scenario seems to have greater odds... how much price will
    exploit that remains to be seen." Sunday evening futures already lean
    that way (S&P futures ~-0.5%, Nasdaq 100 futures ~-1.2%, VIX +~6%, Brent
    approaching $108, WTI above $102), while Dow and Russell 2000 futures
    were only modestly lower. The one mitigating wrinkle is that Treasury
    futures were higher Sunday evening too, suggesting yields may be easing
    rather than joining oil on the upside — the full "oil higher + yields
    higher + stocks lower" bear combination is not yet confirmed. Underneath
    the index, breadth already deteriorated last week (Russell 2000 -2.4%,
    midcaps lagging, only 3/11 sectors advancing) even as price repaired
    faster than participation did. Friday's AI-infrastructure surge (leaders
    +8%-12%) is a genuine bright spot the newsletter explicitly does not want
    chased — a pullback toward support that holds would be constructive, a
    quick surrender of those gains would not. Wednesday's FOMC decision
    (quarter-point hike widely expected) is the key event risk: the hike
    itself is probably manageable, but a surprise hold or hawkish
    aftertaste tied to inflation-behind-the-curve fears could matter more
    than the hike. Nothing here has resolved yet — this is a pre-open read
    of the setup, not a post-close validation against real price action.
  premises:
    - label: "S&P 500 vs the range (7580-7620 support / 7700 reclaim / 7750 hurdle / 7770-7816 breakout)"
      lean: bearish
      detail: "Briefly lost 7600/7620 Thursday, reclaimed Friday — price repaired faster than participation did. Sunday evening S&P futures ~-0.5% lean toward re-testing that support Monday. Not yet a confirmed breakdown or breakout either way."
    - label: "FOMC decision (Wed 9/16)"
      lean: neutral
      detail: "Quarter-point hike is heavily priced in and probably manageable; the real risk is the post-hike signal (one-off vs. more tightening) or a surprise hold read as the Fed falling behind inflation. Unresolved until Wednesday."
    - label: "Oil (Brent/WTI) vs $108/$110 and 10-yr vs 5%"
      lean: bearish
      detail: "Brent approaching $108, WTI above $102 Sunday evening — elevated and the newsletter's key macro variable. Mitigating wrinkle: Treasury futures higher Sunday evening suggests yields may be easing rather than compounding the oil pressure, so the full bear combination isn't confirmed yet."
    - label: "Breadth (Russell 2000, midcaps, sector participation)"
      lean: bearish
      detail: "Russell 2000 -2.4% last week, midcaps lagged, only 3 of 11 sectors advanced. Deteriorated even as the index-level price recovered — participation lagging price repair is the newsletter's central concern."
    - label: "AI-infrastructure leadership (Friday's 8%-12% surge)"
      lean: bullish
      detail: "One of the strongest leadership moves of the week. Unconfirmed whether it holds through a pullback or gets chased and then surrendered — newsletter explicitly prefers the former as the healthier outcome."
    - label: "VIX / risk sentiment"
      lean: bearish
      detail: "VIX up ~6% Sunday evening alongside weaker futures, consistent with building pullback pressure. Not yet a confirmed risk-off move."
    - label: "Seasonality"
      lean: bearish
      detail: "Entering the historically less-forgiving part of September — a background headwind cited alongside oil, breadth and the Fed, not a standalone signal."
  next_catalysts:
    - "Mon 9/14: Cash-session open — first read on whether sellers exploit the bearish setup (oil, weak futures, poor breadth, Fed, seasonality) or price refuses to break 7580-7620"
    - "Wed 9/16: FOMC decision — quarter-point hike widely expected; post-hike guidance (one-off vs. further tightening) matters more than the hike itself"
    - "Ongoing: Brent/WTI vs $108-$110, 10-year Treasury vs 5%, and whether Treasury futures keep signaling easing yields or reverse higher alongside oil"
    - "Ongoing: whether Friday's AI-infrastructure leaders hold their 8%-12% gains through any market-wide pullback"
    - "Sequence to watch: Monday's open -> FOMC (Wed) -> confirm whether 7580-7620 holds or 7550-7500/~7250 comes into play"
