    thesis: "10-month consolidation, still unconfirmed as of last week. No new update this week — remains the key structural tell for whether mega-cap leadership begins a new expansion phase."
    status: "WATCH — key tell"
  - ticker: SPY
    thesis: "Setup: pullback-vs-refusal test. Confirmation (bull): 7580-7620 holds -> 7700 reclaimed -> 7750 cleared -> 7770-7816 taken out. Invalidation (bear): sustained break below 7600 with failed reclaims, then loss of 7550-7500 opening a path to ~7250."
    status: "WATCH"
  - ticker: IWM
    thesis: "Russell 2000 lost 2.4% last week and midcaps lagged — breadth deterioration underneath the index-level reclaim. Setup: needs to stop lagging for a genuine bullish confirmation; continued underperformance keeps the bear case alive even if SPY holds."
    status: "WATCH — caution"
  - ticker: SMH
    thesis: "Part of Friday's AI-infrastructure surge (leaders +8%-12% in one session). Setup: consolidation/pullback toward support preferred over a chase. Confirmation: holds most of the gain through any pullback. Invalidation: quick surrender of the breakout on market-wide weakness."
    status: "OPPORTUNITY — prefer pullback entry"
