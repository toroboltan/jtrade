    thesis: "Carried from last week's post-breakout consolidation thesis; watch alongside the broader AI-infrastructure cohort for whether gains hold through a market-wide pullback."
    status: "OPPORTUNITY — prefer pullback entry"
  - ticker: DELL
    thesis: "Physical AI infrastructure demand name; watch whether it holds up as part of Friday's leadership move or gives back gains alongside a broader pullback."
    status: "OPPORTUNITY — prefer pullback entry"
