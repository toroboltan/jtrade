    - label: "Semiconductor/AI confirmation (SMH vs 573) vs software/cyber follow-through"
      lean: bullish
      detail: "SMH closed $596.03 (+4.02%), decisively above the newsletter's 573 confirmation trigger, with MU +0.45%, SNDK +0.97%, AMD +0.86% and NVDA +2.30% participating. Software/cyber stayed muted rather than reversing (IGV -0.26%, CRWD -0.28%, PANW -0.20%, NET +0.32%, OKTA +0.14%) — chips confirming, the rest of tech still pending its own test."
    - label: "Credit (HYG) confirmation or divergence"
