    - label: "Breadth beneath the index (% above MAs, equal-weight, small/mid-cap)"
      lean: bearish
      detail: "Newsletter's Friday-dated stats (20%/28%/52% of S&P 500 above 20-/50-/200-day averages, 19.3% average rolling drawdown) can't be independently recomputed from our 205-symbol universe. Today's own read is mixed: sector breadth improved (~7/11 advancing) but RSP (+0.18%) — the newsletter's preferred confirmation — was only a modest, unconfirmed step, not the multi-session broadening it's asking for."
    - label: "Rate problem vs oil (10-year near 5%)"
      lean: neutral
      detail: "Oil extended its slide today (IBKR USO -3.68%, XLE -2.88%), continuing to ease the pressure the newsletter flagged. The 10-year sat at ~5% Friday — the level the letter called newly significant in its own right, separate from oil — and bond ETFs (IEF +0.39%, TLT +0.68%) suggest a modest intraday easing rather than a fresh push toward higher yields. Tue-Thu Treasury auctions are the next real test."
