    thesis: "High-yield corporate bonds closed Friday below their 10-/20-/50-day averages, retesting prior swing-low support even as speculative equities rallied — a credit/equity divergence worth watching, not yet a systemic warning."
    status: "WATCH — credit divergence"
  - ticker: IGV
