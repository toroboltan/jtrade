source:
  title: "The Correction From Below"
  author: "C.E. Kirk — Kirk's Opportunities"
  published: "2026-09-26"
  url: "https://kirksopportunities.com/p/the-correction-from-below"
  week_label: "w40"

map:
  breakdown_target: 7511
  range_low: 7609
  range_high: 7800
  breakout_target: 7800
  measured_move_target: "8003 / 8035 (8000-8035 target zone)"
  deeper_downside_target: "7400-7424"

scenarios:
  - name: Bull
    probability: 35
    summary: >-
      The S&P 500 breaks decisively above 7800, completing the potential inverse
      head-and-shoulders reversal (last week's low formed a higher right shoulder),
      while semiconductors and mega-cap growth remain firm and repair spreads into
      previously damaged stocks and groups (biotech, airlines, homebuilders and
      names like MCD/TXN/CRDO/ALAB/AMGN/MRNA/COST/DAL). That would put the
      8000-8035 target zone — the existing 8003 measured-move objective plus the
      new 8035 stretch target — into play.
  - name: Base
    probability: 45
    summary: >-
      The S&P 500 remains between roughly 7609 and 7800, large-cap growth
      continues offsetting weakness elsewhere, and selective repair creates a
      market where stock selection matters considerably more than the index.
      Roughly 40% of stocks are already more than 20% below their own highs even
      as the index sits just below a record — the newsletter's own framing of the
      current backdrop.
  - name: Bear
    probability: 20
    summary: >-
      The S&P 500 loses 7609 (the June 2 high and the larger range-breakout
      support), invalidating that structure while weakness spreads into
      semiconductors and mega-cap leadership instead of staying confined to
      small caps and rate-sensitive groups. That would shift attention toward
      7511 and then roughly 7400-7424.

decision_map:
  - condition: "S&P 500 vs key levels (7800 prior-high/breakout area / 7700 first support / 7650 next support / 7609 June-high critical range-breakout support / 8003 existing measured-move target / 8035 new stretch target from a potential inverse head-and-shoulders reversal)"
    read: "Friday closed near 7742, just beneath the prior highs and the breakout area for a new potential inverse head-and-shoulders reversal (last week's low formed a higher right shoulder). A strong, sustained move through 7800 would complete that setup and open the 8000-8035 target zone (8003 is the existing range-breakout objective, 8035 the new stretch target). Holding above 7650, and especially 7609 (the June 2 high), keeps the bullish structure intact; a sustained break below 7609 shifts attention to 7511, then roughly 7400-7424."
  - condition: "Breadth beneath the index (% above 10-/50-/100-/200-day MAs, % of stocks >20% off highs, median drawdown)"
    read: "Above 10-day MA: 32.8% (+3.8pp over five days); above 50-day: 28.2% (-3.1pp); above 100-day: 34.8% (-3.6pp); above 200-day: 41.2% (-2.0pp). The median S&P 500 constituent sits roughly 16% below its own 52-week peak, and about 40% of stocks are already more than 20% below their highs, even as the index itself sits just below a record high. Friday's advance/decline ratio was nearly 2-to-1 positive with 7 of 11 sectors higher, but the S&P still logged 31 new lows against only 3 new highs (Nasdaq: 175 new lows vs 54 new highs) — breadth improved but did not confirm."
  - condition: "Repair vs. rollover in previously-damaged areas (biotech, airlines, homebuilders, and named repair candidates MCD/TXN/CRDO/ALAB/AMGN/MRNA/COST/DAL)"
    read: "The week's most interesting development may be early improvement in groups that already absorbed substantial damage: biotech +2.55%, airlines +2.69%, homebuilders +2.00% — though airlines remain -12.76% for the quarter and homebuilders -14.92%. The newsletter frames this as the central question for the weeks ahead: do these areas keep repairing while current leaders (semiconductors, mega-cap growth) hold up, or does the repair fail and the hidden correction spread. Named names to watch for follow-through: MCD, TXN, CRDO, ALAB, AMGN, MRNA, COST, DAL."
  - condition: "Leadership concentration (large-cap growth vs. everything else; Magnificent 7 rotation; semiconductor/memory strength)"
    read: "Large Cap Growth is the only size/style segment positive across the week (+2.25%), month (+2.64%) and quarter (+4.18%); every segment below large caps is negative for the quarter (Small Cap Growth -8.92%). Within the Magnificent 7, leadership rotated rather than broadened: META +12.90% week / +33.44% quarter, MSFT +4.53% week / +38.38% quarter (strongest for the quarter), AAPL and NVDA also positive across week/month/quarter — but AMZN -1.59% week, GOOGL -0.97% week, TSLA -11.53% quarter / -17.26% YTD. Semiconductors remain the clearest source of strength (AMD gained near +10% Monday to a new all-time high, crossing $600 and a $1T market cap; Intel rallied; memory stocks saw strong demand), up +5.86% for the week even after -7.52% for the quarter."
  - condition: "Rates vs. oil (10-year near/above 5%, Strait of Hormuz risk)"
    read: "The 10-year began the week below 5% and finished near 5.2%, a level not seen in nearly two decades. Wednesday showed where the pain concentrates: as yields surged the S&P fell 0.8%, Nasdaq -1.1%, Russell 2000 -1.8%, hitting rate-sensitive groups hardest. WTI eased to ~$92 late in the week, but President Trump said Saturday he rejected Iran's latest proposal to reopen the Strait of Hormuz, reducing the diplomatic optimism that had pressured oil lower — the newsletter flagged oil as 'the first important price to watch' when trading resumes; a quick reversal of Friday's decline would put rate/inflation pressure back in the foreground."
  - condition: "Credit and cross-asset confirmation (HYG, VIX, commodities, currencies/crypto, international, hedges/leveraged products)"
    read: "Absolute borrowing costs are high (investment-grade yields approaching 6%, leveraged loans around 10%) but credit spreads remain relatively contained — expensive money rather than broad financial distress, for now. Across other assets, nothing currently confirms a broad risk-off shift: commodities show rotation/crosscurrents rather than a defensive rush, the dollar strengthened (+0.81% week) alongside crypto also rallying (Bitcoin +3.37%), international leadership is selective but not broadly weak, and traditional hedges/doomsday trades (VIX products, bearish Nasdaq/S&P/FANG bets) show no sustained relative strength. The one exception: TZA (leveraged Russell 2000 bear fund) is up +11.67% for the month and +19.89% for the quarter — confirming real small-cap stress even as the broader fear trade stays quiet."
  - condition: "Flow/positioning backdrop and quarter-end (Sept 30) mechanics"
    read: "U.S. equity funds attracted $37.6B during the week (first inflow in five weeks, largest since June), but nearly all of it went to already-strong areas: large-cap funds +$36.62B, technology +$4.89B, while small-cap funds lost another $1.02B — investors are not yet broadly buying the weakness. Wednesday (Sept 30) is quarter-end, which can add mechanical institutional rebalancing flows; Micron reports after the close that day, an important test of AI/memory demand ahead of next earnings season."

watchlist:
  - ticker: SPY
    thesis: "Price roadmap: hold 7609 (June 2 high, critical range-breakout support) -> clear 7650/7700 -> clear 7800 (prior highs, breakout/reversal area) -> 8000-8035 target zone (8003 existing + 8035 new stretch target). Invalidation: a sustained break below 7609 shifts attention to 7511, then 7400-7424."
    status: "WATCH — key levels"
  - ticker: QQQ
    thesis: "Nasdaq 100 remains the strongest major index, S&P 500 close behind, while equal-weight and small caps continue to lag — the clearest read on how concentrated leadership currently is."
    status: "WATCH — leadership gauge"
  - ticker: RSP
    thesis: "S&P Equal Weight — the newsletter's own preferred breadth confirmation. Wants better equal-weight performance alongside current leaders holding up, not just another strong cap-weighted index close."
    status: "WATCH — breadth confirmation"
  - ticker: IWM
    thesis: "Russell 2000 fell for the week (-0.75%) and quarter (-6.15%) despite the S&P's gain — smaller companies remain far more exposed to higher borrowing costs (~30% have variable-rate debt vs ~6% for large caps). TZA (leveraged Russell 2000 bear fund, +11.67% month / +19.89% quarter) is the one hedge actually confirming stress."
    status: "WATCH — stress tell"
  - ticker: MAGS
    thesis: "Magnificent 7 — leadership is rotating rather than disappearing: META and MSFT strong across week/month/quarter, AAPL/NVDA positive, but AMZN/GOOGL/TSLA lagging or negative. Key mega-cap-leadership tell."
    status: "WATCH — key tell"
  - ticker: SMH
    thesis: "Semiconductors remain the clearest source of strength — AMD gained near +10% Monday to a new all-time high, crossing $600 and a $1T market cap; Intel rallied; memory demand stayed strong. Best outcome: this holds while participation improves elsewhere."
    status: "OPPORTUNITY — momentum leader"
  - ticker: MU
    thesis: "Reports earnings after the close Wednesday Sept 30, entering with elevated expectations after renewed memory/AI-related strength. Chart shows a bullish reversal setup attempting to reclaim and extend beyond the prior high. Watching HBM demand/pricing, 2027 commitments, capacity, margins and conventional DRAM — and, just as importantly, how the stock trades after the news."
    status: "CATALYST — earnings 9/30"
  - ticker: HYG
    thesis: "Absolute borrowing costs are high (IG yields near 6%, leveraged loans ~10%) but credit spreads remain relatively contained so far — expensive money rather than broad financial distress. Materially widening spreads would be the more serious warning sign."
    status: "WATCH — credit tell"
  - ticker: USO
    thesis: "WTI eased to ~$92 late last week, but Trump's Saturday rejection of Iran's latest Hormuz-reopening proposal reduces the diplomatic optimism that had pressured oil lower. The newsletter calls oil the first important price to watch when trading resumes — a quick reversal of Friday's decline would put rate/inflation pressure back in the foreground."
    status: "WATCH — macro catalyst"
  - ticker: "MCD, TXN, CRDO, ALAB, AMGN, MRNA, COST, DAL"
    thesis: "Named individual-stock candidates for repair in previously-damaged areas (alongside biotech/airlines/homebuilders more broadly). Worth watching for additional evidence that buyers are beginning to return, not just index-level strength."
    status: "WATCH — repair basket"

validation:
  as_of: "2026-09-28"
  concluded_scenario: "Base (Yellow Light) — the week opened with the exact stress test the newsletter flagged (Strait of Hormuz risk reigniting, yields pushing to fresh multi-year highs) already showing up; the S&P held inside the 7609-7800 range but slid toward its lower half rather than testing the 7800 breakout."
  concluded_note: >-
    IB Gateway was unreachable today — both check_connection and
    check_subscriptions returned a TimeoutError against 127.0.0.1:4001 — so this
    validation pass relies on external reporting rather than our own account/
    scan data; no run_scan or dashboard republish has been done yet for w40, and
    account/positions could not be confirmed. Real market data: the S&P 500 fell
    0.77% to close at 7,683.69, comfortably inside the newsletter's 7609-7800
    base-case range but a rough start to the week rather than a push toward the
    7800 breakout area. The 10-year Treasury yield climbed to roughly 5.21-5.25%,
    the highest level since 2007, as traders refocused on hawkish Fed commentary
    plus a lack of progress in US-Iran talks. Oil was the day's dominant story:
    WTI spiked as high as ~$96.54 intraday before settling near $92.60 (+0.2%),
    after President Trump said Saturday he rejected Iran's latest proposal to
    reopen the Strait of Hormuz — though Saudi Arabia reportedly restored ~3.5
    million barrels/day via an alternate pipeline, which likely capped the
    spike. VIX stayed low at 14.87, still no confirmation of a broad risk-off
    move despite the equity/bond/oil volatility. SMH pulled back to ~$594.80
    (-1.9% from Friday's $606.56 close) but remains well clear of the 573 level
    that mattered in prior weeks. HYG closed at $77.54, essentially flat-to-
    slightly-softer versus Friday, with high-yield spreads still contained
    (~2.80% OAS as of the most recent read) — no sign yet of the credit crack
    that would turn this more serious. Net: today looks like the newsletter's
    own flagged risk (rates + Hormuz) showing up on schedule, but contained
    within the stated Base-case range rather than breaking it — Base stays the
    most probable scenario, with the Bear case's 7609 level now somewhat closer
    than it was Friday.
  premises:
    - label: "S&P 500 vs key levels (7609 support / 7650 / 7700 / 7800 breakout-reversal area / 8003-8035 target zone)"
      lean: neutral
      detail: "SPX closed 7,683.69 (-0.77%), comfortably inside the 7609-7800 base-case range and well clear of the 7609 critical support, but sliding toward the lower half of the range rather than pressing the 7800 breakout/reversal test."
    - label: "Breadth beneath the index (% above MAs, % of stocks >20% off highs)"
      lean: neutral
      detail: "No independent same-day recompute of the newsletter's own stats (32.8%/28.2%/34.8%/41.2% above 10-/50-/100-/200-day MAs, ~40% of stocks >20% off highs) — these remain sourced, Friday-dated facts pending this week's own confirmation."
    - label: "Repair vs. rollover in previously-damaged areas (biotech/airlines/homebuilders, MCD/TXN/CRDO/ALAB/AMGN/MRNA/COST/DAL)"
      lean: neutral
      detail: "Too early in the week for a same-day read; no IBKR data available today (Gateway down) to check these names individually. First real test arrives as the week progresses."
    - label: "Leadership concentration (large-cap growth, Magnificent 7 rotation, semiconductor/memory strength)"
      lean: bearish
      detail: "SMH itself pulled back ~1.9% today alongside the broader market sell-off — a reminder that even current leaders aren't immune to a rates/oil-driven risk-off day, though the pullback stays well above the 573 level that mattered in prior weeks."
    - label: "Rates vs. oil (10-year near/above 5%, Strait of Hormuz risk)"
      lean: bearish
      detail: "10-year yield pushed to ~5.21-5.25%, the highest since 2007, while WTI spiked to ~$96.54 intraday (settling near $92.60) after Trump rejected Iran's Hormuz-reopening proposal Saturday — close to the newsletter's explicitly-flagged 'damaging combination' of yields rising while other pressures build, though Saudi Arabia's alternate-pipeline restoration likely capped the oil spike."
    - label: "Credit and cross-asset confirmation (HYG, VIX, hedges)"
      lean: neutral
      detail: "HYG $77.54, essentially flat vs Friday's close, with spreads still contained (~2.80% OAS) — no widening yet. VIX stayed low at 14.87 despite the day's yield/oil volatility, still no broad risk-off confirmation."
    - label: "Flow/positioning backdrop and quarter-end (Sept 30) mechanics"
      lean: neutral
      detail: "Unchanged from the newsletter's own framing — last week's $37.6B equity-fund inflow stayed concentrated in large-cap/tech while small-cap funds lost another $1.02B. Quarter-end (Wed Sept 30) and Micron's after-the-close earnings that day are still ahead, not yet live."
